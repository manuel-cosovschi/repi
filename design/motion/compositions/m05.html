  <script>
    const tl = gsap.timeline({ paused: true });
    const E = "power3.out"; // aproxima cubic-bezier(.2,0,0,1) de la app (GSAP no trae esa curva sin CustomEase)
    // Los estados iniciales están en el HTML; cada fromTo arranca en su posición (sin render inmediato) para que repetir la secuencia sea estable.
    const ft = (target, from, to, at) => tl.fromTo(target, from, { ...to, immediateRender: false }, at);

    const STEP = 306; // ancho de tarjeta 294 + gap 12
    function swipe(t, k) {
      // Arrastre manual: la pista sigue al dedo; al soltar, scroll-snap asienta en la tarjeta siguiente.
      ft("#m05-finger", { opacity: 0, x: 280, y: 260 }, { opacity: 1, duration: .08 * k }, t - .08 * k);
      tl.to("#m05-row", { x: -110, duration: .25 * k, ease: "none" }, t);
      tl.to("#m05-finger", { x: 170, duration: .25 * k, ease: "none" }, t);
      tl.to("#m05-row", { x: -STEP, duration: .26 * k, ease: E }, t + .25 * k);
      tl.to("#m05-finger", { opacity: 0, duration: .12 * k }, t + .25 * k);
      tl.set("#m05-n", { textContent: "2" }, t + .51 * k); tl.set("#m05-prev", { opacity: 1 }, t + .51 * k);
    }
    function tap(t, k) {
      // Botón Siguiente: desplazamiento suave del navegador (~260 ms medidos en Chrome; depende del navegador).
      ft("#m05-finger", { opacity: 0, x: 348, y: 414 }, { opacity: 1, duration: .08 * k }, t - .1 * k);
      tl.to("#m05-finger", { opacity: 0, duration: .12 * k }, t + .05 * k);
      tl.to("#m05-row", { x: -2 * STEP, duration: .26 * k, ease: E }, t);
      tl.set("#m05-n", { textContent: "3" }, t + .26 * k); tl.set("#m05-next", { opacity: .35 }, t + .26 * k);
    }
    swipe(.8, 1); tap(1.7, 1);

    tl.set("#m05-row", { x: 0 }, 2.5); tl.set("#m05-n", { textContent: "1" }, 2.5); tl.set("#m05-prev", { opacity: .35 }, 2.5); tl.set("#m05-next", { opacity: 1 }, 2.5);
