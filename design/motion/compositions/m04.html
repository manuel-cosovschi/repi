  <div id="root" data-composition-id="m04" data-width="780" data-height="1688" data-start="0" data-duration="5.6">

        <div id="m04-sl" class="sl" style="opacity:0" data-layout-allow-overlap><div class="head"><span>Esfuerzo de la sesión (1 = muy fácil · 10 = máximo)</span><b id="m04-val" class="val">—</b></div>
          <div id="m04-track" class="track"><i id="m04-rail" class="rail"></i><i id="m04-fill" class="fill"></i>

  <script>
    const tl = gsap.timeline({ paused: true });
    const E = "power3.out"; // aproxima cubic-bezier(.2,0,0,1) de la app (GSAP no trae esa curva sin CustomEase)
    // Los estados iniciales están en el HTML; cada fromTo arranca en su posición (sin render inmediato) para que repetir la secuencia sea estable.
    const ft = (target, from, to, at) => tl.fromTo(target, from, { ...to, immediateRender: false }, at);

    // Pista de 302 px (330 − 2×12 + márgenes) dentro de la tarjeta; posición x del thumb en px del track.
    const TW = 294, TX = 20 + 16 + 12, TY = 150 + 52 + 26 + 8 + 24;
    const xOf = (i) => (i / 9) * TW;
    const st = { pos: -1 };
    const show = () => { const on = st.pos >= 0; gsap.set("#m04-thumb", { opacity: on ? 1 : 0, x: on ? xOf(st.pos) : 0 }); gsap.set("#m04-fill", { width: on ? xOf(st.pos) + 12 : 0 });
      document.getElementById("m04-val").textContent = on ? `${Math.round(st.pos) + 1} de 10` : "—"; };
    function run(t, k, target) {
      tl.set("#m04-sl", { opacity: 0 }, t - .01); tl.set("#m04-pill", { opacity: 1 }, t - .01);
      tl.call(() => { st.pos = -1; show(); }, null, t - .01);
      ft("#m04-finger", { opacity: 0, x: 90, y: 224 }, { opacity: 1, duration: .1 * k }, t - .15 * k);
      // Abrir: 200 ms (pista 0→1 en X), etiqueta 150 ms.
      tl.set("#m04-pill", { opacity: 0 }, t); tl.set("#m04-sl", { opacity: 1 }, t);
      ft("#m04-rail", { scaleX: 0 }, { scaleX: 1, duration: .2 * k, ease: E }, t);
      ft("#m04-val", { opacity: 0 }, { opacity: 1, duration: .15 * k, ease: E }, t);
      // Arrastre: sigue al dedo sin retardo; al soltar ajusta al paso más cercano (180 ms).
      const d0 = t + .45 * k, d1 = d0 + .55 * k;
      tl.to("#m04-finger", { x: TX, y: TY, duration: .3 * k, ease: "power2.inOut" }, t + .1 * k);
      ft(st, { pos: 0 }, { pos: target + .38, duration: .55 * k, ease: "power1.inOut", onUpdate: show, onStart: show }, d0);
      ft("#m04-finger", { x: TX }, { x: TX + xOf(target + .38), duration: .55 * k, ease: "power1.inOut" }, d0);
      tl.to(st, { pos: target, duration: .18 * k, ease: E, onUpdate: show }, d1);
      tl.to("#m04-finger", { opacity: 0, duration: .15 * k }, d1);
    }
    tl.call(show, null, 0);
    run(.7, 1, 6);
    tl.set("#m04-speed", { textContent: "×3 más lento" }, 2.6);
    run(2.95, 2.2, 6);

    window.__timelines["m04"] = tl;
  </script>
