  <script>
    const tl = gsap.timeline({ paused: true });
    const E = "power3.out"; // aproxima cubic-bezier(.2,0,0,1) de la app (GSAP no trae esa curva sin CustomEase)
    // Los estados iniciales están en el HTML; cada fromTo arranca en su posición (sin render inmediato) para que repetir la secuencia sea estable.
    const ft = (target, from, to, at) => tl.fromTo(target, from, { ...to, immediateRender: false }, at);

    // Misma función determinista que apps/web/src/lib/confetti.ts (semilla fija).
    const CF = { count: 32, emitFrom: 80, emitFor: 180, end: 1200, colors: ["#00D1FF", "#5DE6D8", "#F8FAFC"] };
    function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    const r = rng(20261026);
    const P = Array.from({ length: CF.count }, () => { const ang = -Math.PI / 2 + (r() - .5) * Math.PI * .95, sp = .28 + r() * .34;
      return { t0: CF.emitFrom + r() * CF.emitFor, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, w: 5 + r() * 4, h: 3 + r() * 4, spin: (r() - .5) * .02, rot0: r() * Math.PI, color: CF.colors[Math.floor(r() * 3)] }; });
    // En la app las partículas van en un canvas; acá son 32 elementos para que la composición sea editable y verificable.
    const els = P.map((p, i) => { const e = document.getElementById("m02-p" + i); e.style.width = p.w + "px"; e.style.height = p.h + "px"; e.style.background = p.color; return e; });
    function draw(t) {
      P.forEach((p, i) => { const e = els[i];
        if (t < p.t0 || t >= CF.end) { e.style.opacity = 0; return; }
        const dt = t - p.t0, k = dt / (CF.end - p.t0);
        e.style.opacity = k < .6 ? 1 : Math.max(0, 1 - (k - .6) / .4);
        e.style.transform = "translate(" + (195 + p.vx * dt - p.w / 2) + "px, " + (178 + p.vy * dt + .5 * .0011 * dt * dt - p.h / 2) + "px) rotate(" + (p.rot0 + p.spin * dt) + "rad)"; }); }
    function run(t, k) {
      tl.set("#m02-done", { opacity: 0 }, t - .01); tl.set("#m02-work", { opacity: 1 }, t - .01);
      tl.set("#m02-work", { opacity: 0 }, t); // la app reemplaza el entrenamiento por el resumen; no hay cruce
      ft("#m02-done", { opacity: 0 }, { opacity: 1, duration: .24 * k, ease: E }, t);
      ft("#m02-ring", { opacity: 0, scale: .94 }, { opacity: 1, scale: 1, duration: .24 * k, ease: E }, t);
      ft("#m02-pr", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .24 * k, ease: E }, t + .16 * k);
      const s = { ms: 0 }; ft(s, { ms: 0 }, { ms: 1200, duration: 1.2 * k, ease: "none", onUpdate: () => draw(s.ms) }, t);
    }
    draw(-1);
    run(.8, 1);
    tl.set("#m02-speed", { textContent: "×3 más lento" }, 2.6);
    run(2.9, 2.2);

    window.__timelines["m02"] = tl;
  </script>
