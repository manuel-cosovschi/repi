# D190: respaldo de producción verificado y cifrado en GitHub Releases. Procedimiento y recuperación: docs/RESPALDOS.md.
#   - Diario (03:17 Buenos Aires), manual («Run workflow») o a pedido con un issue titulado «Respaldo: <motivo>» abierto
#     por el dueño del repositorio (así Claude Code lo pide antes de migrar). Obligatorio antes de cada migración productiva.
#   - Contenido: PostgreSQL de Supabase (todas las tablas de public), registro de migraciones, archivos de Storage y
#     manifest.json con el SHA-256 de cada archivo.
#   - Sólo lectura y sin secretos guardados: rol repi_backup (READ ONLY) con una contraseña temporal que entrega la Edge
#     Function repi-backup-credentials al token OIDC de este job, y Storage con el mismo tipo de token.
#   - Se cifra con age para la clave pública del titular (la privada está FUERA de GitHub) y una clave efímera del job.
#     Con la efímera, el job descifra el archivo YA CIFRADO, recalcula los hashes y lo restaura en un PostgreSQL
#     descartable del runner (filas, claves foráneas y restricciones). Recién entonces se publica.
#   - Nada sin cifrar sale del runner: el único artefacto es el archivo CIFRADO (1 día) y nada entra al historial de Git.
#   - Retención: último de cada uno de 30 días + primero de cada uno de 4 meses; el último válido nunca se borra.
#   - Si falla, abre (o comenta) un issue «Respaldo de producción fallido»; el siguiente éxito lo cierra.
# En un PR que toca el respaldo corre la AUTOPRUEBA: la misma cadena sobre una base de demostración del runner, con
# claves de prueba, incluida la subida y la descarga de un release borrador que se borra al terminar.
name: Respaldo

on:
  schedule:
    # GitHub puede demorar o descartar una ejecución programada (pasó el 05/11/2026): hay dos turnos por día y el segundo
    # sólo respalda si el primero no dejó el respaldo diario de ese día (ver «Automatización habilitada»).
    - cron: "17 6 * * *"    # 03:17 Buenos Aires
    - cron: "47 12 * * *"   # 09:47 Buenos Aires, reserva
  workflow_dispatch:
    inputs:
      motivo:
        description: "Motivo (p. ej. «antes de la migración 0042»)"
        required: false
        default: "manual"
        type: string
  issues:
    types: [opened]
  pull_request:
    paths:
      - .github/workflows/backup.yml
      - apps/web/scripts/operations/**
      - apps/web/tests/operations/**
      - supabase/functions/repi-storage/**
      - supabase/functions/repi-backup-credentials/**

permissions: {}

concurrency:
  group: respaldo-${{ github.event_name == 'pull_request' && github.ref || 'produccion' }}
  cancel-in-progress: false

env:
  RESTORE_DATABASE_URL: postgresql://repi:repi-ci-only@localhost:5432/repi_restore_check
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # La automatización diaria se habilita sola recién cuando existe un primer respaldo manual verificado y publicado
  # (prueba completa con los secretos reales). Hasta entonces, el cronograma no hace nada ni abre avisos.
  habilitado:
    name: Automatización habilitada
    # Un issue sólo pide respaldo si lo abre el dueño y su título empieza con «Respaldo:»; cualquier otro issue no hace nada.
    if: >-
      github.event_name != 'pull_request' && (github.event_name != 'issues' ||
      (github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, 'Respaldo:')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          N="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and (.tag_name | test("^backup-[0-9]{8}-[0-9]{6}-[0-9]+$")) and ((.body // "") | contains("<!-- repi-backup:verified -->"))) | .tag_name' | grep -c . || true)"
          echo "Respaldos verificados publicados: ${N:-0}. Cronograma diario: $([ "${N:-0}" -gt 0 ] && echo habilitado || echo 'en espera del primero')." >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" != "schedule" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${N:-0}" -eq 0 ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Todavía no hay un respaldo manual verificado: el cronograma espera a la primera ejecución manual exitosa."; exit 0; fi
          # Un respaldo diario por día (UTC): si otro turno ya lo publicó y verificó hoy, este no repite. Se usa published_at:
          # en la API de GitHub, created_at de un release es la fecha del COMMIT de destino, no la del respaldo.
          HOY="$(date -u +%Y-%m-%d)"
          D="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft == false and ((.published_at // \"\") | startswith(\"$HOY\")) and ((.body // \"\") | contains(\"<!-- repi-backup:verified -->\")) and ((.body // \"\") | contains(\"- Motivo: diario\"))) | .tag_name" | grep -c . || true)"
          if [ "${D:-0}" -gt 0 ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Respaldo diario de $HOY ya publicado y verificado: este turno no repite." >> "$GITHUB_STEP_SUMMARY"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

  respaldo:
    name: Respaldo de producción
    needs: habilitado
    if: needs.habilitado.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write   # crear el release y subir el archivo cifrado
      id-token: write   # token OIDC: lectura firmada de Storage y credencial temporal de la base
    outputs:
      tag: ${{ steps.publicar.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configuración
        env:
          RECIPIENTS: ${{ vars.REPI_BACKUP_AGE_RECIPIENTS }}
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/respaldo"
          # Clave pública del titular: la variable si existe; si no, la del repositorio (es pública por diseño).
          if [ -n "$RECIPIENTS" ]; then printf '%s\n' "$RECIPIENTS" | tr ', ' '\n\n'; else cat apps/web/scripts/operations/backup-recipients.txt; fi \
            | sed 's/#.*//; /^[[:space:]]*$/d' > "$RUNNER_TEMP/respaldo/destinatarios.txt"
          [ -s "$RUNNER_TEMP/respaldo/destinatarios.txt" ] || { echo "::error::No hay clave pública age del titular."; exit 1; }
      - name: Credencial temporal de sólo lectura
        env:
          DB: ${{ secrets.REPI_BACKUP_DATABASE_URL }}
          FN: https://qiamewdridgdvsyysmog.supabase.co/functions/v1/repi-backup-credentials
        run: |
          # Sin secretos guardados: la Edge Function verifica el token OIDC de este job (backup.yml en main) y fija una
          # contraseña aleatoria para repi_backup que vence en 2 h; al final del job se revoca. Nada se imprime.
          F="$RUNNER_TEMP/respaldo/db-url"
          if [ -n "$DB" ]; then echo "::add-mask::$DB"; printf '%s' "$DB" > "$F"; echo "Credencial: secreto del repositorio."; exit 0; fi
          T="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=repi-backup-db" | jq -r .value)"
          echo "::add-mask::$T"
          P="$(curl -sSf -X POST -H "x-repi-github-oidc: $T" "$FN?op=issue" | jq -r .password)" || { echo "::error::La Edge Function no entregó la credencial."; exit 1; }
          [ -n "$P" ] && [ "$P" != "null" ] || { echo "::error::La Edge Function no entregó la credencial."; exit 1; }
          echo "::add-mask::$P"
          printf 'postgresql://repi_backup.qiamewdridgdvsyysmog:%s@aws-1-sa-east-1.pooler.supabase.com:5432/postgres' "$P" > "$F"
          echo "Credencial temporal emitida (vence en 2 h; se revoca al terminar)."
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL descartable y age
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          sudo systemctl start postgresql.service
          sudo -u postgres psql -qc "create role repi login superuser password 'repi-ci-only'"
          sudo -u postgres createdb -O repi repi_restore_check
      - name: Respaldo (sólo lectura)
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/respaldo/plano"
          export REPI_BACKUP_DATABASE_URL="$(cat "$RUNNER_TEMP/respaldo/db-url")"
          # El pooler puede tardar unos segundos en aceptar la contraseña recién fijada.
          for i in $(seq 1 12); do
            (cd apps/web && node --input-type=module -e 'import p from "postgres"; const s = p(process.env.REPI_BACKUP_DATABASE_URL, { max: 1, prepare: false, connect_timeout: 10 }); try { await s`select 1`; } finally { await s.end(); }' 2>/dev/null) && break
            [ "$i" = 12 ] && { echo "::error::No se pudo conectar con el rol de sólo lectura."; exit 1; }
            sleep 10
          done
          pnpm --filter @repi/web ops:backup --source=hosted --storage --storage-auth=github-oidc --out="$RUNNER_TEMP/respaldo/plano"
      - name: Cifrado, descifrado de prueba y restauración verificada
        working-directory: apps/web
        run: |
          R="$RUNNER_TEMP/respaldo"
          SRC="$(ls -d "$R"/plano/*-hosted)"
          ./scripts/operations/backup-ci.sh pack "$SRC" "$R/cifrado" "$R/destinatarios.txt"
          # Lo único que queda sin cifrar se borra antes de probar el archivo cifrado.
          rm -rf "$R/plano"
          ./scripts/operations/backup-ci.sh verify "$(ls "$R"/cifrado/*.tar.gz.age)" "$R/cifrado/.ephemeral.key" "$R/prueba" "$R/informe.json"
          rm -rf "$R/prueba" "$R/cifrado/.ephemeral.key"
      - name: Publicación en GitHub Releases
        id: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          MOTIVO: ${{ github.event_name == 'schedule' && 'diario' || github.event_name == 'issues' && github.event.issue.title || inputs.motivo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          R="$RUNNER_TEMP/respaldo"
          F="$(ls "$R"/cifrado/*.tar.gz.age)"
          TAG="backup-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          node -e '
            const r = require(process.argv[1]), fs = require("fs");
            const [file, sha] = fs.readFileSync(process.argv[2] + ".sha256", "utf8").trim().split(/\s+/).reverse();
            const motivo = String(process.env.MOTIVO || "manual").replace(/[^\p{L}\p{N} .,:()#\/-]/gu, "").slice(0, 120);
            const keys = fs.readFileSync(process.argv[3], "utf8").trim().split("\n");
            fs.writeFileSync(process.argv[4], [
              `Respaldo de producción de REPI (${new Date().toISOString().slice(0, 16).replace("T", " ")} UTC).`, "",
              `- Motivo: ${motivo}`, `- Ejecución: ${process.env.RUN_URL}`, `- Código: ${process.env.GITHUB_SHA}`,
              `- Contenido: PostgreSQL (${r.tables} tablas, ${r.rows} filas), registro de ${r.migrations} migraciones, ${r.storageFiles} archivos de Storage (${r.storageBytes} bytes) y manifest.json con SHA-256 de cada archivo.`,
              `- Base: SHA-256 \`${r.databaseSha256}\` (${r.databaseBytes} bytes).`,
              `- Archivo cifrado: \`${file}\` (${fs.statSync(process.argv[2]).size} bytes), SHA-256 \`${sha}\`.`,
              `- Cifrado con age para: ${keys.map((k) => "`" + k + "`").join(", ")}. La clave privada está fuera de GitHub.`,
              `- Verificado: descifrado del archivo publicado, hashes del manifiesto, restauración en PostgreSQL descartable, ${r.foreignKeys} claves foráneas sin huérfanos y ${r.invalidConstraints} restricciones sin validar.`,
              "", "Recuperación: docs/RESPALDOS.md. Nunca se restaura sobre producción.", "", "<!-- repi-backup:verified -->", ""].join("\n"));
          ' "$R/informe.json" "$F" "$R/destinatarios.txt" "$R/notas.md"
          # Borrador primero: hasta que la descarga coincide byte a byte no cuenta como respaldo válido.
          # LB-11: por encima de 1900 MiB se publica en partes (GitHub admite 2 GiB por archivo); la descarga las une y compara.
          mapfile -t FILES < <(apps/web/scripts/operations/backup-ci.sh split "$F")
          [ "${#FILES[@]}" -gt 2 ] && echo "- Publicado en $(( ${#FILES[@]} - 2 )) partes con su SHA-256 (índice \`$(basename "$F").parts\`); \`restore-from-release.sh\` las une." >> "$R/notas.md"
          ID="$(apps/web/scripts/operations/backup-ci.sh release-draft "$TAG" "Respaldo $(date -u +%Y-%m-%d) · $TAG" "$R/notas.md" "$GITHUB_SHA" "${FILES[@]}")"
          apps/web/scripts/operations/backup-ci.sh release-download "$ID" "$R/descarga"
          cmp "$F" "$R/descarga/$(basename "$F")" && cmp "$F.sha256" "$R/descarga/$(basename "$F").sha256" || { echo "::error::La descarga del release no coincide con lo subido."; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=false >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          { echo "### Respaldo verificado y publicado"; echo; echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG"; sed -n '/^- Contenido/,/^- Verificado/p' "$R/notas.md"; } >> "$GITHUB_STEP_SUMMARY"
      # D198: señal al vigilante de REPI (independiente de este cronograma) y, si se configuró, a un «dead man's switch» externo.
      # Se autentica con el token OIDC de este job (backup.yml en main, audiencia propia, atado a esta corrida): no hace falta
      # ningún secreto en GitHub. Si existe BACKUP_HEARTBEAT_SECRET se usa ese. Si falla, el respaldo igual queda publicado y el
      # vigilante avisa a las 30 h.
      - name: Señal de respaldo verificado
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          HB_SECRET: ${{ secrets.BACKUP_HEARTBEAT_SECRET }}
          HB_URL: ${{ vars.BACKUP_HEARTBEAT_URL || 'https://repiclub.com/api/cron/backup-heartbeat' }}
          DEADMAN_URL: ${{ secrets.BACKUP_DEADMAN_URL }}
          TAG: ${{ steps.publicar.outputs.tag }}
        run: |
          BODY="{\"tag\":\"$TAG\",\"run\":\"$GITHUB_RUN_ID\"}"
          if [ -n "$HB_SECRET" ]; then
            AUTH="authorization: Bearer $HB_SECRET"; VIA="secreto"
          else
            T="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=repi-backup-heartbeat" | jq -r .value)" || T=""
            echo "::add-mask::$T"
            AUTH="x-repi-github-oidc: $T"; VIA="token OIDC"
          fi
          C="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST "$HB_URL" -H "$AUTH" -H "content-type: application/json" -d "$BODY" || true)"
          if [ "$C" = "200" ]; then echo "Vigilante de REPI: señal enviada ($VIA)."; else echo "::warning::El vigilante de REPI no recibió la señal ($VIA, HTTP $C)."; fi
          if [ -n "$DEADMAN_URL" ]; then curl -fsS --max-time 20 "$DEADMAN_URL" -o /dev/null && echo "Señal externa enviada." || echo "::warning::La señal externa falló."; fi
      # Sólo el archivo CIFRADO, 1 día: permite comprobar desde afuera que la clave del titular lo abre.
      - name: Copia cifrada para la prueba de la clave del titular
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-cifrado-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/respaldo/cifrado/*.tar.gz.age
            ${{ runner.temp }}/respaldo/cifrado/*.tar.gz.age.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Retención
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | {tag: .tag_name, createdAt: (.published_at // .created_at), draft, body}' > "$RUNNER_TEMP/releases.jsonl"
          pnpm -s --filter @repi/web ops:retention < "$RUNNER_TEMP/releases.jsonl" > "$RUNNER_TEMP/borrar.txt"
          while read -r T; do [ -n "$T" ] && gh release delete "$T" -R "$GITHUB_REPOSITORY" --cleanup-tag -y && echo "Eliminado por retención: $T"; done < "$RUNNER_TEMP/borrar.txt"
      - name: Revocar la credencial temporal
        if: always()
        env:
          DB: ${{ secrets.REPI_BACKUP_DATABASE_URL }}
          FN: https://qiamewdridgdvsyysmog.supabase.co/functions/v1/repi-backup-credentials
        run: |
          [ -n "$DB" ] && exit 0
          T="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=repi-backup-db" | jq -r .value)" || exit 0
          echo "::add-mask::$T"
          curl -sSf -X POST -H "x-repi-github-oidc: $T" "$FN?op=revoke" >/dev/null && echo "Credencial revocada." || echo "::warning::No se pudo revocar; vence sola en 2 h."
      - name: Limpieza
        if: always()
        run: rm -rf "$RUNNER_TEMP/respaldo"

  aviso:
    name: Aviso
    needs: [habilitado, respaldo]
    if: always() && github.event_name != 'pull_request' && needs.habilitado.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Respuesta al pedido
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RESULT: ${{ needs.habilitado.result == 'failure' && 'failure' || needs.respaldo.result }}
          TAG: ${{ needs.respaldo.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FOOT=$'\n\n---\n_Aviso automático del workflow Respaldo (docs/RESPALDOS.md)._'
          if [ "$RESULT" = "success" ]; then
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" -c "Respaldo verificado y publicado: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG (ejecución: $RUN_URL).$FOOT"
          else
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" -b "El respaldo terminó en «$RESULT»: $RUN_URL. **No se migra.**$FOOT"
          fi
      - name: Alerta
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.habilitado.result == 'failure' && 'failure' || needs.respaldo.result }}
          TAG: ${{ needs.respaldo.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Respaldo de producción fallido"
          OPEN="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$TITLE\" and (.pull_request | not)) | .number" | head -1)"
          FOOT=$'\n\n---\n_Aviso automático del workflow Respaldo (docs/RESPALDOS.md)._'
          [ "$RESULT" = "skipped" ] && exit 0
          if [ "$RESULT" = "success" ]; then
            [ -n "$OPEN" ] && gh issue close "$OPEN" -R "$GITHUB_REPOSITORY" -c "Respaldo verificado otra vez: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG ($RUN_URL).$FOOT"
            exit 0
          fi
          BODY="El respaldo de producción terminó en «$RESULT»: $RUN_URL"$'\n\n'"No se publicó un respaldo nuevo; el último válido sigue en Releases. **No apliques migraciones hasta que un respaldo vuelva a verificarse.**$FOOT"
          if [ -n "$OPEN" ]; then gh issue comment "$OPEN" -R "$GITHUB_REPOSITORY" -b "$BODY"; else gh issue create -R "$GITHUB_REPOSITORY" -t "$TITLE" -b "$BODY" -a "$GITHUB_REPOSITORY_OWNER"; fi

  autoprueba:
    name: Autoprueba (sin datos reales)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # release borrador de prueba, se borra al terminar
      id-token: write   # para comprobar que las Edge Functions RECHAZAN el token de un PR
    env:
      DATABASE_URL: postgresql://repi:repi-ci-only@localhost:5432/repi_dev
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-00
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ROSTER_HMAC_SECRET: ci-only-roster
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guardas (retención y token de Storage)
        run: pnpm --filter @repi/web test:guards
      - name: Las Edge Functions rechazan el token de un PR
        run: |
          for pair in "repi-backup-db repi-backup-credentials?op=issue" "repi-storage-backup repi-storage?op=sign_read&key=x"; do
            set -- $pair
            T="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$1" | jq -r .value)"
            echo "::add-mask::$T"
            C="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "x-repi-github-oidc: $T" "https://qiamewdridgdvsyysmog.supabase.co/functions/v1/$2")"
            [ "$C" = 404 ] || { echo "::error::$2 respondió $C a un token de PR (se esperaba 404)."; exit 1; }
            echo "Rechazado como corresponde: $2 con token de PR"
          done
      - name: Base de demostración, PostgreSQL descartable y age
        working-directory: apps/web
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          sudo systemctl start postgresql.service
          sudo -u postgres psql -qc "create role repi login superuser password 'repi-ci-only'"
          sudo -u postgres createdb -O repi repi_dev
          sudo -u postgres createdb -O repi repi_restore_check
          pnpm exec tsx scripts/migrate.ts
          pnpm exec tsx scripts/seed-demo.ts > /dev/null
      - name: Cadena completa con claves de prueba
        working-directory: apps/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/auto"; mkdir -m 700 -p "$R/plano" "$R/titular"
          age-keygen -o "$R/titular/clave.txt" 2>/dev/null; age-keygen -y "$R/titular/clave.txt" > "$R/titular/destinatarios.txt"
          pnpm -s ops:backup --source=local --out="$R/plano"
          SRC="$(ls -d "$R"/plano/*-local)"
          ./scripts/operations/backup-ci.sh pack "$SRC" "$R/cifrado" "$R/titular/destinatarios.txt"
          F="$(ls "$R"/cifrado/*.tar.gz.age)"
          ./scripts/operations/backup-ci.sh verify "$F" "$R/cifrado/.ephemeral.key" "$R/prueba-efimera" "$R/informe.json"
          cat "$R/informe.json"
          # Release borrador: subir, bajar y comparar; después, el procedimiento de recuperación con la clave «del titular».
          TAG="backup-autoprueba-${GITHUB_RUN_ID}"
          printf 'Borrador temporal de la autoprueba del PR (datos de demostración); se borra al terminar.\n' > "$R/notas.md"
          ID="$(./scripts/operations/backup-ci.sh release-draft "$TAG" "Autoprueba de respaldo (sin datos reales)" "$R/notas.md" "$GITHUB_SHA" "$F" "$F.sha256")"
          echo "$ID" > "$R/release-id"
          ./scripts/operations/backup-ci.sh release-download "$ID" "$R/descarga"
          cmp "$F" "$R/descarga/$(basename "$F")"
          REPI_RESTORE_DIR="$R/recuperacion" ./scripts/operations/restore-from-release.sh --archivo "$R/descarga/$(basename "$F")" "$R/titular/clave.txt"
          # Una clave que no es la del titular no descifra; un archivo alterado tampoco.
          age-keygen -o "$R/otra.txt" 2>/dev/null
          rechaza() { if REPI_RESTORE_DIR="$R/rechazo-$1" ./scripts/operations/restore-from-release.sh --archivo "$2" "$3" --sin-base; then echo "::error::Se aceptó $1"; exit 1; fi; echo "Rechazado como corresponde: $1"; }
          rechaza clave-ajena "$F" "$R/otra.txt"
          mkdir "$R/alterado"; cp "$F" "$R/alterado/a.tar.gz.age"; cp "$F" "$R/alterado/b.tar.gz.age"; cp "$F.sha256" "$R/alterado/a.tar.gz.age.sha256"
          for X in a b; do printf '\x00' | dd of="$R/alterado/$X.tar.gz.age" bs=1 seek=4096 conv=notrunc 2>/dev/null; done
          rechaza alterado-con-sha256 "$R/alterado/a.tar.gz.age" "$R/titular/clave.txt"
          rechaza alterado-sin-sha256 "$R/alterado/b.tar.gz.age" "$R/titular/clave.txt"
          # LB-11: el mismo archivo en partes chicas (como uno de más de 1900 MiB): publicar, bajar, unir y recuperar.
          mkdir "$R/partes"; cp "$F" "$F.sha256" "$R/partes/"; P="$R/partes/$(basename "$F")"
          mapfile -t FILES < <(REPI_BACKUP_PART_BYTES=$(( $(stat -c %s "$F") / 3 + 1 )) ./scripts/operations/backup-ci.sh split "$P")
          [ "${#FILES[@]}" -eq 5 ] || { echo "::error::Se esperaban 3 partes + índice + sha256 (${#FILES[@]})."; exit 1; }
          ID2="$(./scripts/operations/backup-ci.sh release-draft "$TAG-partes" "Autoprueba de respaldo en partes (sin datos reales)" "$R/notas.md" "$GITHUB_SHA" "${FILES[@]:0:4}" "$P.sha256")"
          echo "$ID2" >> "$R/release-id"
          ./scripts/operations/backup-ci.sh release-download "$ID2" "$R/descarga-partes"
          cmp "$F" "$R/descarga-partes/$(basename "$F")"
          mkdir "$R/solo-partes"; cp "$R"/descarga-partes/*.part-* "$R"/descarga-partes/*.parts "$R"/descarga-partes/*.sha256 "$R/solo-partes/"
          REPI_RESTORE_DIR="$R/recuperacion-partes" ./scripts/operations/restore-from-release.sh --archivo "$R/solo-partes/$(basename "$F")" "$R/titular/clave.txt"
          # Una parte alterada o faltante se rechaza antes de descifrar.
          mkdir "$R/parte-alterada" "$R/parte-faltante"
          cp "$R"/solo-partes/*.part-* "$R"/solo-partes/*.parts "$R/parte-alterada/"; printf '\x00' | dd of="$(ls "$R"/parte-alterada/*.part-001)" bs=1 seek=10 conv=notrunc 2>/dev/null
          cp "$R"/solo-partes/*.part-000 "$R"/solo-partes/*.part-002 "$R"/solo-partes/*.parts "$R/parte-faltante/"
          rechaza parte-alterada "$R/parte-alterada/$(basename "$F")" "$R/titular/clave.txt"
          rechaza parte-faltante "$R/parte-faltante/$(basename "$F")" "$R/titular/clave.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | {tag: .tag_name, createdAt: (.published_at // .created_at), draft, body}' | pnpm -s ops:retention > /dev/null
          echo "Autoprueba completa."
      - name: Borrar el release de prueba
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # El de esta ejecución y cualquier borrador de autoprueba que haya quedado de una anterior.
          { cat "$RUNNER_TEMP/auto/release-id" 2>/dev/null || true
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft and (.tag_name | startswith("backup-autoprueba-"))) | .id' || true
          } | sort -u | while read -r ID; do [ -n "$ID" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID" && echo "Borrador de prueba borrado: $ID"; done || true
          rm -rf "$RUNNER_TEMP/auto"
